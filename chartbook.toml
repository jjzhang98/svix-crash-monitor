[project]
name = "HW 3 - SVIX and the Probability of a Crash"
description = "Ian Martin's SVIX index and option-implied crash probabilities, rebuilt every morning from E-mini S&P 500 option settlements on CME Globex; and the Martin-Shi crash bounds for single names from the OptionMetrics surface"
maintainer = "Jeremiah Bejarano"
contributors = ["Jeremiah Bejarano", "Riley Haas", "Marija Jovicic", "Andrew Heekin", "Chandler Bird"]
os_compatibility = ["Windows", "Linux", "macOS"]
build = """
uv run doit
"""

[notebooks]


[notebooks.01_es_options_data_ipynb]
name = "E-mini S&P 500 Options Data from Databento"
description = "What the end-of-month E-mini options are, what a settlement price is, how the Databento pull works, and what one session's smile looks like."
path = "_output/01_es_options_data_ipynb.ipynb"


[notebooks.02_svix_and_crash_probability_ipynb]
name = "Replicating SVIX and the Probability of a Crash"
description = "From settlement prices to the simple variance swap rate, the risk-neutral distribution by Breeden-Litzenberger, and the probability of a 20% drop; checked against the Cboe VIX, with the SVIX integral checked against Martin's published series in guide 04."
path = "_output/02_svix_and_crash_probability_ipynb.ipynb"


[notebooks.03_daily_monitor_ipynb]
name = "The Daily Monitor"
description = "The replication run every morning by GitHub Actions: the history of SVIX and the crash probabilities, the workflow that pulls the latest session, appends its row, and publishes the page, and why the history lives on a branch of its own."
path = "_output/03_daily_monitor_ipynb.ipynb"


[notebooks.04_single_name_crash_bounds_ipynb]
name = "Crash Bounds for Single Names (Martin and Shi 2025)"
description = "The Frechet-Hoeffding bounds on the probability that Apple or AIG falls 20% in a month, from the OptionMetrics surface; and the index probability checked against Martin's published series."
path = "_output/04_single_name_crash_bounds_ipynb.ipynb"


[dataframes]


[dataframes.es_options_settlements]
name = "E-mini S&P 500 Option Settlements (Databento)"
description = "One row per listed end-of-month E-mini S&P 500 option per session: the exchange's settlement price, joined to the contract's expiration, strike, and right; the trailing week"
path = "_data/es_options_settlements.parquet"
date_col = "date"
tags = ["Options", "Volatility", "Databento"]
pull_method = "Databento Historical API via src/pull_es_options.py (cost-guarded)"
docs = """Settlement prices (`statistics` schema, `stat_type` 3) for every
listed contract under the parent symbol `EW.OPT` on CME Globex (`GLBX.MDP3`),
joined to the exchange's `definition` records for the expiration date, the
strike, and the right. Settlements exist for every strike, traded or not,
which is why they, and not daily bars, feed the smile. `doit` pulls the
window in the settings again when it changes; `doit latest` pulls the most
recent session."""


[dataframes.svix_monitor_history]
name = "SVIX Monitor History"
description = "One row per session: the 30-day SVIX next to the VIX, and the risk-neutral, log-investor, and power-utility probabilities of a 20% (and 10%) drop in the S&P 500 by the expiration closest to one month"
path = "_output/svix_monitor_history.csv"
date_col = "date"
tags = ["Options", "Volatility", "Monitor"]
pull_method = "Computed by src/monitor.py from the Databento settlements and FRED; `doit` adds the sessions in the window in the settings, `doit latest` the most recent one"
docs = """One row per CME Globex session, oldest first, computed by
`src/monitor.py` from that session's E-mini S&P 500 option settlements and
the one-month Treasury yield (DGS1MO) from FRED. SVIX is Martin's (2017)
simple variance swap rate at a constant 30-day horizon: total variance is
interpolated linearly in time between the two end-of-month expirations that
bracket 30 days. The crash probabilities are read off the risk-neutral
distribution of the expiration closest to one month (`days_used`).

Columns: `date`; `near_expiry`, `far_expiry`, `days_near`, `days_far` (the
two bracketing expirations); `forward_near` (the parity-implied price of the
underlying future); `rate` (DGS1MO, decimal); `svix2_near`, `svix2_far`,
`svix2_30` (SVIX squared, annualized); `svix_30` (the 30-day index, in VIX
units); `days_used`; `p_star_20`, `p_log_20`, `p_power_20` (the
risk-neutral, log-investor, and power-utility with gamma = 2 probabilities
of a 20% drop, as fractions, not percent); `p_star_10`, `p_log_10` (the same
for a 10% drop); `vix` (the Cboe VIX close from FRED).

The default `doit` adds every session in the pull window that the history
does not have; `doit latest` adds the most recent one. A session already in
the file is replaced by its new row, so running either twice is harmless.
FRED posts the VIX close the next morning, so the newest row's `vix` can be
blank until a later run fills it in. On the live monitor, the deploy
workflow keeps this file on the `monitor-history` branch between runs, one
small commit a day."""


[charts]


[charts.svix_monitor]
name = "SVIX and the Probability of a Crash"
description = "The 30-day SVIX next to the VIX, and the probability of a 20% drop in the S&P 500 within a month under three sets of beliefs"
dataframe = "svix_monitor_history"
tags = ["Options", "Volatility", "Monitor"]
frequency = "Daily"
units = "Annualized volatility (%); probability (%)"
path = "./_output/svix_monitor.html"
docs_path = "./docs_src/charts/svix_monitor.md"
